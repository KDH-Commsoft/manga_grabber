name: Manga Update Checker

on:
  # Runs every 30 minutes (closest GitHub cron supports to 45 min)
  schedule:
    - cron: "0,30 * * * *"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  check-manga-updates:
    name: Check for New Chapters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run manga checker
        env:
          # Required — Gmail address sending the notification
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          # Required — where notifications are delivered (can be same address)
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
          # Required — Gmail App Password (NOT your normal Gmail password)
          # Generate one at: https://myaccount.google.com/apppasswords
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Optional — only needed if not using Gmail
          SMTP_SERVER:    ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
        run: python manga_checker.py
